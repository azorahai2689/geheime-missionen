<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geheime Missionen</title>
<style>
body{
background:#000;
color:white;
font-family:Arial;
padding:20px;
text-align:center;
}
button{
width:90%;
padding:18px;
margin:10px;
border:none;
border-radius:18px;
font-size:28px;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#4b006e,#8a00c2);
}
.green{background:linear-gradient(90deg,#006400,#00aa00);}
.blue{background:linear-gradient(90deg,#001f7a,#0055ff);}
.black{background:#111;}
.card{
border:2px solid #ff6600;
border-radius:25px;
padding:20px;
margin-top:20px;
}
</style>
</head>
<body>

<h1 style="color:#ff9900;">🎭 Geheime Missionen</h1>

<div class="card">
<button onclick="createProfile()">👤 Profil erstellen</button>
<button onclick="showProfiles()">📊 Profile anzeigen</button>
<button onclick="changeAvatar()">🖼️ Profilbild ändern</button>
<button class="black" onclick="deleteProfile()">🗑️ Profil löschen</button>
<button class="green" onclick="saveProfiles()">📤 Profile sichern</button>
<button class="blue" onclick="restoreProfiles()">📥 Profile wiederherstellen</button>
<button class="blue" onclick="continueRound()">🔄 Runde fortsetzen</button>
</div>

<div id="profiles"></div>

<input type="file" id="restoreInput" accept=".json" style="display:none">

<script>
let profiles = JSON.parse(localStorage.getItem("profiles") || "[]");

function updateStorage(){
localStorage.setItem("profiles", JSON.stringify(profiles));
}

function createProfile(){
let name = prompt("Profilname?");
if(!name) return;

profiles.push({
name:name,
score:0
});

updateStorage();
showProfiles();
alert("Profil erstellt.");
}

function showProfiles(){
const box = document.getElementById("profiles");

if(profiles.length===0){
box.innerHTML = "<h2>Keine Profile vorhanden.</h2>";
return;
}

let html = "<div class='card'><h2>Profile</h2>";

profiles.forEach((p,i)=>{
html += `
<div style="margin:15px;padding:10px;border:1px solid #555;border-radius:12px;">
<b>${p.name}</b><br>
${p.score} Punkte
</div>
`;
});

html += "</div>";
box.innerHTML = html;
}

function changeAvatar(){
alert("Profilbild ändern funktioniert in der Beta später.");
}

function deleteProfile(){
if(profiles.length===0){
alert("Keine Profile vorhanden.");
return;
}

let name = prompt("Welches Profil löschen?");
if(!name) return;

profiles = profiles.filter(p => p.name !== name);

updateStorage();
showProfiles();

alert("Profil gelöscht.");
}

function saveProfiles(){
const data = JSON.stringify(profiles, null, 2);

const blob = new Blob([data], {type:"application/json"});
const url = URL.createObjectURL(blob);

const a = document.createElement("a");
a.href = url;
a.download = "geheime-missionen-backup.json";
a.click();

URL.revokeObjectURL(url);

alert("Backup gespeichert.");
}

function restoreProfiles(){
document.getElementById("restoreInput").click();
}

document.getElementById("restoreInput").addEventListener("change", function(event){

const file = event.target.files[0];

if(!file){
alert("Keine Datei ausgewählt.");
return;
}

const reader = new FileReader();

reader.onload = function(e){

try{
profiles = JSON.parse(e.target.result);

updateStorage();
showProfiles();

alert("Profile erfolgreich wiederhergestellt.");

}catch(err){
alert("Ungültige Backup-Datei.");
}

};

reader.readAsText(file);

});

function continueRound(){
alert("Runde fortgesetzt.");
}

showProfiles();
</script>

</body>
</html>
