<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Original Style</title>
<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}
.qr-box{
    width:520px;
    margin:40px auto;
    background:#050505;
    border:3px solid #b100ff;
    border-radius:28px;
    padding:30px;
    box-shadow:0 0 20px #b100ff;
}
.title{
    display:flex;
    align-items:center;
    gap:20px;
    color:#d000ff;
    font-size:52px;
    font-weight:bold;
}
.row{
    display:flex;
    align-items:flex-start;
    gap:25px;
    margin-top:28px;
}
.icon{
    width:70px;
    height:70px;
    border:3px solid #b100ff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    color:white;
}
.text h2{
    margin:0;
    font-size:28px;
}
.text p{
    margin:6px 0 0;
    color:#ccc;
    font-size:20px;
}
.highlight{
    color:#d000ff;
    font-weight:bold;
}
hr{
    border:0;
    border-top:1px solid #333;
    margin:22px 0;
}
</style>
</head>
<body>
<div class="qr-box">
<div class="title">⌗ QR-FUNKTION</div>

<div class="row">
<div class="icon">📱</div>
<div class="text">
<h2>QR-Code scannen</h2>
<p>Jeder Spieler scannt seinen QR-Code.</p>
</div>
</div>

<hr>

<div class="row">
<div class="icon">🔒</div>
<div class="text">
<h2>Profil übernehmen</h2>
<p>Nur der Spieler steuert sein Profil.</p>
<p class="highlight">Der Host kann nicht schummeln.</p>
</div>
</div>

<hr>

<div class="row">
<div class="icon">↪</div>
<div class="text">
<h2>Schließen</h2>
<p>Der Spieler klickt unten auf „Schließen“, danach steuert wieder der Host.</p>
</div>
</div>

</div>
</body>
</html>
