<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geheime Missionen</title>
<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
button{
    width:100%;
    padding:20px;
    margin:10px 0;
    border:none;
    border-radius:20px;
    font-size:24px;
    font-weight:bold;
    color:white;
}
.red{background:#8b0000;}
.green{background:#006400;}
.blue{background:#003399;}
.purple{background:#5a007a;}
.card{
    border:1px solid #ff6600;
    border-radius:25px;
    padding:20px;
    margin:20px 0;
}
</style>
</head>
<body>

<h1>🎯 Geheime Missionen</h1>

<button class="purple" onclick="createProfile()">👤 Profil erstellen</button>
<button class="purple" onclick="showProfiles()">📊 Profile anzeigen</button>
<button class="red" onclick="deleteProfile()">🗑️ Profil löschen</button>

<div class="card">
<h2>🟢 Leicht</h2>
<button class="blue" onclick="selectProfiles('leicht')">👥 Profile auswählen</button>
</div>

<div class="card">
<h2>🟠 Normal</h2>
<button class="blue" onclick="selectProfiles('normal')">👥 Profile auswählen</button>
</div>

<div class="card">
<h2>🔴 Experte</h2>
<button class="blue" onclick="selectProfiles('experte')">👥 Profile auswählen</button>
</div>

<button class="red">🎮 Spiel starten</button>
<button class="green">💾 Spielstand speichern</button>
<button class="blue">📂 Spielstand laden</button>

<script>
function getProfiles(){
    return JSON.parse(localStorage.getItem("profiles") || "[]");
}

function saveProfiles(p){
    localStorage.setItem("profiles", JSON.stringify(p));
}

function createProfile(){
    const name = prompt("Profilname:");
    if(!name) return;

    let profiles = getProfiles();

    profiles.push({
        name:name,
        points:0
    });

    saveProfiles(profiles);
    alert("Profil erstellt!");
}

function showProfiles(){
    let profiles = getProfiles();

    if(profiles.length === 0){
        alert("Keine Profile vorhanden");
        return;
    }

    alert(
        profiles.map((p,i)=>
            (i+1)+". "+p.name+" ("+p.points+" Punkte)"
        ).join("\n")
    );
}

function deleteProfile(){
    let profiles = getProfiles();

    if(profiles.length === 0){
        alert("Keine Profile vorhanden");
        return;
    }

    let text = profiles.map((p,i)=>
        (i+1)+". "+p.name
    ).join("\n");

    let choice = prompt("Welches Profil löschen?\n\n"+text);

    if(!choice) return;

    let index = parseInt(choice)-1;

    if(index >=0 && index < profiles.length){
        profiles.splice(index,1);
        saveProfiles(profiles);
        alert("Profil gelöscht");
    }
}

function selectProfiles(level){
    let profiles = getProfiles();

    if(profiles.length === 0){
        alert("Bitte zuerst Profile erstellen");
        return;
    }

    let text = profiles.map((p,i)=>
        (i+1)+". "+p.name
    ).join("\n");

    alert("Ausgewählt für "+level+":\n\n"+text);
}
</script>

</body>
</html>
