<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Verdacht Emoji Fix</title>
<style>
.gmVerdachtTitle{
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    gap:18px !important;
}

.gmVerdachtTitle .detIcon{
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    font-size:35px !important;
    line-height:1 !important;
    transform:none !important;
}

@media(max-width:700px){
  .gmVerdachtTitle .detIcon{
    font-size:33px !important;
  }
}
</style>
</head>
<body>

<div class="gmVerdachtTitle">
  <span class="detIcon">🕵🏻‍♂️</span>
  <span>VERDACHT</span>
  <span class="detIcon">🕵🏼‍♀️</span>
</div>

</body>
</html>
